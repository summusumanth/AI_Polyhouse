services:
  mongo:
    image: mongo:7
    container_name: polyhouse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: polyhouse
      MONGO_INITDB_ROOT_PASSWORD: polyhouse
      MONGO_INITDB_DATABASE: polyhouse
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web UI for browsing the data at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: polyhouse-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://polyhouse:polyhouse@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
