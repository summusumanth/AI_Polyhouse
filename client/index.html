<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f5" />
    <meta
      name="description"
      content="Polyhouse - AI-powered smart agriculture. Live climate monitoring, automatic control and computer-vision plant phenotyping for polyhouses, speed breeding rooms and phenotyping stations."
    />
    <link rel="icon" href="/leaf.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Polyhouse · AI-Powered Smart Agriculture</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem("polyhouse.theme.v2");
          document.documentElement.dataset.theme =
            saved === "dark" || saved === "light" ? saved : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
